# Atualiza o painel de atividade do README (assets/atividade-*.svg) uma vez por dia.
# Usa só o GITHUB_TOKEN do próprio workflow (sem token pessoal) e lê a visão pública do perfil.
name: Atividade

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gerar SVGs
        run: node scripts/atividade.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || { git commit -m "Atividade atualizada"; git push; }
